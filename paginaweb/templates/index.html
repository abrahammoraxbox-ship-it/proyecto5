<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 2rem;
        }
        main {
            padding: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Bienvenidos a mi sitio web!</h1>
        <p>Creado desde cero con HTML y CSS</p>
    </header>

    <main>
        <h2>Sobre mí</h2>
        <p>Este es un ejemplo básico de cómo se ve una estructura web limpia y moderna.</p>
        <a href="#" class="btn">Haz clic aquí</a>
    </main>

</body>
</html>
